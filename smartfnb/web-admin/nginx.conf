server {
  listen 80;
  root /usr/share/nginx/html;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /api/ {
    proxy_pass http://svc-portal:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;            # SSE必需
    proxy_read_timeout 130s;
  }
  location /graphql {
    proxy_pass http://svc-portal:8080;
  }
}
