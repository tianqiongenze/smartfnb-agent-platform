# Phase1: MDM数据质量门禁 CronJob(每日06:00)
apiVersion: batch/v1
kind: CronJob
metadata: { name: quality-check, namespace: fnb-prod }
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: quality
            image: 10.167.2.175:30500/fnb/tools:0.2.0
            args: ["python", "quality_check.py"]
            env:
            - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } } }
---
# Phase1: 预警推送 CronJob(每日07:35, 计算T-1后推送HIGH预警)
apiVersion: batch/v1
kind: CronJob
metadata: { name: alert-push, namespace: fnb-prod }
spec:
  schedule: "35 7 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: push
            image: 10.167.2.175:30500/fnb/tools:0.2.0
            args: ["python", "alert_push.py"]
            env:
            - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } } }
            - name: WECOM_WEBHOOK
              valueFrom: { configMapKeyRef: { name: app-config, key: WECOM_WEBHOOK, optional: true } }
---
# Phase1: H5门店领料页
apiVersion: apps/v1
kind: Deployment
metadata: { name: h5-store, namespace: fnb-prod, labels: { app: h5-store } }
spec:
  replicas: 1
  selector: { matchLabels: { app: h5-store } }
  template:
    metadata: { labels: { app: h5-store } }
    spec:
      containers:
      - name: h5
        image: 10.167.2.175:30500/fnb/h5-store:0.1.0
        ports: [{ containerPort: 80 }]
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 128Mi }
        readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata:
  name: h5-store
  namespace: fnb-prod
spec:
  type: NodePort
  selector: { app: h5-store }
  ports: [{ port: 80, nodePort: 30254 }]
