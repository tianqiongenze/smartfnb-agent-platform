# 核心服务部署: recipe / inventory / portal / agent-runtime / mcp-fnb-tools / web-admin
apiVersion: apps/v1
kind: Deployment
metadata: { name: svc-recipe, namespace: fnb-prod, labels: { app: svc-recipe } }
spec:
  replicas: 2
  selector: { matchLabels: { app: svc-recipe } }
  template:
    metadata:
      labels: { app: svc-recipe }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /actuator/prometheus }
    spec:
      containers:
      - name: recipe
        image: 10.167.2.175:30500/fnb/svc-recipe:0.2.1
        env:
        - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } } }
        - { name: DB_PORT, valueFrom: { configMapKeyRef: { name: app-config, key: DB_PORT } } }
        - { name: DB_USER, valueFrom: { configMapKeyRef: { name: app-config, key: DB_USER } } }
        - { name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true" }
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "1", memory: 1Gi }
        readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 25, periodSeconds: 10 }
        livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 45, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: svc-recipe, namespace: fnb-prod }
spec:
  selector: { app: svc-recipe }
  ports: [{ port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: svc-inventory, namespace: fnb-prod, labels: { app: svc-inventory } }
spec:
  replicas: 2
  selector: { matchLabels: { app: svc-inventory } }
  template:
    metadata:
      labels: { app: svc-inventory }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /actuator/prometheus }
    spec:
      containers:
      - name: inventory
        image: 10.167.2.175:30500/fnb/svc-inventory:0.3.3
        env:
        - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } } }
        - { name: DB_PORT, valueFrom: { configMapKeyRef: { name: app-config, key: DB_PORT } } }
        - { name: DB_USER, valueFrom: { configMapKeyRef: { name: app-config, key: DB_USER } } }
        - { name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true" }
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "1", memory: 1Gi }
        readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 25, periodSeconds: 10 }
        livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 45, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: svc-inventory, namespace: fnb-prod }
spec:
  selector: { app: svc-inventory }
  ports: [{ port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: svc-portal, namespace: fnb-prod, labels: { app: svc-portal } }
spec:
  replicas: 2
  selector: { matchLabels: { app: svc-portal } }
  template:
    metadata:
      labels: { app: svc-portal }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /actuator/prometheus }
    spec:
      containers:
      - name: portal
        image: 10.167.2.175:30500/fnb/svc-portal:0.1.2
        env:
        - { name: RECIPE_URL, value: "http://svc-recipe:8080" }
        - { name: INVENTORY_URL, value: "http://svc-inventory:8080" }
        - { name: AGENT_URL, value: "http://agent-runtime:8000" }
        - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: fnb-secret, key: jwt-secret } } }
        - { name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true" }
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "1", memory: 1Gi }
        readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 25, periodSeconds: 10 }
        livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 45, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata:
  name: svc-portal
  namespace: fnb-prod
spec:
  type: NodePort
  selector: { app: svc-portal }
  ports: [{ port: 8080, nodePort: 30251 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-fnb-tools, namespace: fnb-prod, labels: { app: mcp-fnb-tools } }
spec:
  replicas: 2
  selector: { matchLabels: { app: mcp-fnb-tools } }
  template:
    metadata: { labels: { app: mcp-fnb-tools } }
    spec:
      containers:
      - name: mcp
        image: 10.167.2.175:30500/fnb/mcp-fnb-tools:0.4.0
        env:
        - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } } }
        ports: [{ containerPort: 8000 }]
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "1", memory: 512Mi }
        readinessProbe: { tcpSocket: { port: 8000 }, periodSeconds: 15, failureThreshold: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-fnb-tools, namespace: fnb-prod }
spec:
  selector: { app: mcp-fnb-tools }
  ports: [{ port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: agent-runtime, namespace: fnb-prod, labels: { app: agent-runtime } }
spec:
  replicas: 2
  selector: { matchLabels: { app: agent-runtime } }
  template:
    metadata: { labels: { app: agent-runtime } }
    spec:
      containers:
      - name: agent
        image: 10.167.2.175:30500/fnb/agent-runtime:0.6.5
        env:
        - { name: MCP_URL, valueFrom: { configMapKeyRef: { name: app-config, key: MCP_URL } } }
        - { name: OLLAMA_BASE, value: "http://fnb-ollama.fnb-prod.svc.cluster.local:11434" }
        - { name: LLM_MAIN, value: "qwen3:8b" }
        - { name: LLM_FAST, value: "qwen3:4b" }
        ports: [{ containerPort: 8000 }]
        resources:
          requests: { cpu: 500m, memory: 1Gi }
          limits: { cpu: "2", memory: 2Gi }
        readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 15, failureThreshold: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: fnb-prod
spec:
  type: NodePort
  selector: { app: agent-runtime }
  ports: [{ port: 8000, nodePort: 30252 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web-admin, namespace: fnb-prod, labels: { app: web-admin } }
spec:
  replicas: 1
  selector: { matchLabels: { app: web-admin } }
  template:
    metadata: { labels: { app: web-admin } }
    spec:
      containers:
      - name: web
        image: 10.167.2.175:30500/fnb/web-admin:0.1.1
        ports: [{ containerPort: 80 }]
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 128Mi }
        readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata:
  name: web-admin
  namespace: fnb-prod
spec:
  type: NodePort
  selector: { app: web-admin }
  ports: [{ port: 80, nodePort: 30250 }]
---
# Ingress(web-admin 为主入口, 依赖已有 ingress-nginx)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartfnb
  namespace: fnb-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "130"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
  - host: fnb.local
    http:
      paths:
      - path: /api/agent
        pathType: Prefix
        backend: { service: { name: svc-portal, port: { number: 8080 } } }
      - path: /
        pathType: Prefix
        backend: { service: { name: web-admin, port: { number: 80 } } }
