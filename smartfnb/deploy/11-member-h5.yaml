# Phase3: svc-member 会员服务 + C端H5
apiVersion: apps/v1
kind: Deployment
metadata: { name: svc-member, namespace: fnb-prod, labels: { app: svc-member } }
spec:
  replicas: 2
  selector: { matchLabels: { app: svc-member } }
  template:
    metadata:
      labels: { app: svc-member }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /actuator/prometheus }
    spec:
      containers:
      - name: member
        image: 10.167.2.175:30500/fnb/svc-member:0.1.0
        env:
        - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } } }
        - { name: DB_PORT, valueFrom: { configMapKeyRef: { name: app-config, key: DB_PORT } } }
        - { name: DB_USER, valueFrom: { configMapKeyRef: { name: app-config, key: DB_USER } } }
        - { name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true" }
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "1", memory: 1Gi }
        readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 25, periodSeconds: 10 }
        livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 45, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: svc-member, namespace: fnb-prod }
spec:
  selector: { app: svc-member }
  ports: [{ port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: h5-member, namespace: fnb-prod, labels: { app: h5-member } }
spec:
  replicas: 1
  selector: { matchLabels: { app: h5-member } }
  template:
    metadata: { labels: { app: h5-member } }
    spec:
      containers:
      - name: h5
        image: 10.167.2.175:30500/fnb/h5-member:0.1.0
        ports: [{ containerPort: 80 }]
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 128Mi }
        readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata:
  name: h5-member
  namespace: fnb-prod
spec:
  type: NodePort
  selector: { app: h5-member }
  ports: [{ port: 80, nodePort: 30255 }]
