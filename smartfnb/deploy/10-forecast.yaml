# Phase3: svc-forecast 需求预测服务 + daily_demand 预计算Job
apiVersion: batch/v1
kind: Job
metadata: { name: daily-demand, namespace: fnb-prod }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: dd
        image: 10.167.2.175:30500/fnb/tools:0.2.2
        args: ["python", "daily_demand.py"]
        env: [{ name: DB_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } } }]
        volumeMounts: [{ name: sql, mountPath: /sql }]
      volumes:
      - name: sql
        configMap: { name: fnb-sql }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: svc-forecast, namespace: fnb-prod, labels: { app: svc-forecast } }
spec:
  replicas: 2
  selector: { matchLabels: { app: svc-forecast } }
  template:
    metadata: { labels: { app: svc-forecast } }
    spec:
      containers:
      - name: forecast
        image: 10.167.2.175:30500/fnb/svc-forecast:0.1.0
        env:
        - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } } }
        ports: [{ containerPort: 8000 }]
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "1", memory: 1Gi }
        readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 15, failureThreshold: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: svc-forecast, namespace: fnb-prod }
spec:
  selector: { app: svc-forecast }
  ports: [{ port: 8000 }]
